
<!DOCTYPE html>
<html>
<head>
    <title>GoTdo Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        .navbar {
            display: flex;
            align-items: center;
            background-color: green;
            height: 90px;
        }
        .logo {
            background-color: red;
            width: 250px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo img {
            width: 90px;
            height: 65px;
        }
        .menu {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex: 2;
        }
        .menu a {
            color: white;
            text-decoration: none;
        }

        .menu select {
            background-color: green;
            color: white;
            border: none;
            padding: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .login {
            background-color: yellow;
            height: 90px;
            flex: 1;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        button {
            padding: 5px 10px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <!-- Logo -->
        <div class="logo">
            <img src="./icon.jpeg" alt="Logo">
        </div>

        <!-- Menu -->
        <div class="menu">
            <a href="#">Homepage</a>
            <a href="#">About GoTodo</a>

            <select name="pages" id="pages-select">
                <option value="">Pages</option>
                <option value="home">Home</option>
                <option value="about">About Us</option>
                <option value="services">Services</option>
                <option value="contact">Contact</option>
            </select>

            <a href="#">Contact</a>
        </div>

        <!-- Login Buttons -->
        <div class="login">
            <button>Register</button>
            <button>Login</button>
        </div>
      <background-image: url('icon.jpeg');></background-image:>
      <background width: 100%; height: 100%;></background>
    </div>
   

</body>
</html>

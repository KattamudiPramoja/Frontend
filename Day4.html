<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form action="">
    <h1>Create Your Account</h1>
    <p>Join us and get started today</p>
<div>
    <label for="Full Name">Full Name</label>
    <br>
    
    <input type="text">
</div>
<br>
<div>
    <label for="Email">Email Address</label>
    <br>
    <input type="email" id="Email">
</div>
<br>
<div>
    <label for="Password" onclick="checkPasswords()">Password</label>
    <br>
    <input type="password" id="Password">
</div>
<br>
<div>
    <label for="checkbox" onclick="checkPasswords()">Confirm Password</label>
    <br>
    <input type="password" id="Confirm Password">
</div>
<br>
<div>
    <label for="Gender"id >Gender</label>
    <br>
    <input type="radio" name="Gender" id="Male">
    <label for="Male">Male</label>
    <input type="radio" name="Gender" id="Female">
    <label for="Female">Female</label>
    <input type="radio" name="Gender" id="Other">
    <label for="Other">Other</label>
</div>
<br>
<div>
    <label for="Date of Birth">Date of Birth</label>
    <br>
    <input type="date" id="Date of Birth">
</div>
<br>
<div>
    <label for="Country">Country</label>
    <br>
    <select name="country"id="Country">
        <option value="USA">India</option>
        <option value="India">USA</option>
        <option value="Nigeria">Nigeria</option>
        <option value="Ghana">Srilanka</option>
    </select>
    </div>
<br>
    <input type="checkbox" id="Terms and Conditions">
    <label for="Terms and Conditions">I agree to the <span style="color:red">Terms of Service</span>
        and <span style="color:red">Privacy Policy</span></label>
</div>
<br>
<div>
    <br>
    <i></i>
    <button type="submit">REGISTER NOW</button>
</div>
<br>
<div>
    <p>Already have an account? <a href="Login.html" style="text-decoration:none;color:red;">LOGIN</a> </p>

</div>
</form>
</body>
</html>
